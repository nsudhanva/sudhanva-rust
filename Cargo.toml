[package]
name = "sudhanva"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Client for the public sudhanva.me API"
license = "MIT"
repository = "https://github.com/nsudhanva/sudhanva-rust"
homepage = "https://sudhanva.me/developers/sdks/"
documentation = "https://docs.rs/sudhanva"
readme = "README.md"
keywords = ["api", "client", "sdk", "agents", "sudhanva"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**/*.rs", "tests/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[features]
default = []
# A synchronous client that drives the async client on its own Tokio runtime.
blocking = ["tokio/rt"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
thiserror = "2"
tokio = { version = "1.40", default-features = false, features = ["time"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
# wiremock 0.6.5 needs Rust 1.88 (let chains) without declaring it; 0.6.4 builds on 1.85.
wiremock = "=0.6.4"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
